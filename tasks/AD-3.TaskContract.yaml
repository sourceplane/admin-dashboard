    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - specs/epics/admin-dashboard
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - a product placed from it carries the product only, branded
  gates: []
