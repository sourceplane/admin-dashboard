# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (AD → AD-1, AD-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: admin-dashboard
  key: AD
spec:
  title: "Vercel's Admin Dashboard on Cloudflare Workers and Supabase"
  summary: "Vercel's Next.js Admin Dashboard — a products table with search and paging read through Drizzle, a customers page, Auth.js with GitHub sign-in, shadcn/ui and Tailwind — run on Cloudflare Workers + Static Assets through @opennextjs/cloudflare, its Postgres a Supabase project reached through Hyperdrive, both provisioned by Terraform; the schema, the template's products and the session key applied by db-migrate; GitHub sign-in connected by its owner after the build; and become an Orun baseline that takes a new product from nothing to live on stage and prod in one landing."
  state: completed
  milestones:
    - name: "AD0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [AD-1]
    - name: "AD1 — the dashboard on Workers and Supabase"
      exitCriteria:
        - "apps/web is the template on Next.js 16.3.8, built by OpenNext into one Worker, its Postgres the HYPERDRIVE binding with a client per request, Auth.js through the proxy"
        - "the products table, the template's ten products and the session key are packages/db migrations, applied by db-migrate; the Supabase and Hyperdrive roots provision stage and prod"
        - "with no GitHub OAuth App the dashboard builds, serves signed-out and its login page says how to connect one; with one it offers GitHub sign-in"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green"
      tasks: [AD-2]
    - name: "AD2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in one landing, then record it"
        - "a product built from it carries the product only, renamed throughout to its own name, repository, Worker, Supabase project and Hyperdrive config"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [AD-3]
