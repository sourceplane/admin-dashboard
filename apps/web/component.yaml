apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The admin dashboard (Next.js and Auth.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP, ENFORCED ON MAIN. A merge to main converges the whole
  # product in one run: the Supabase project, then the Hyperdrive config over
  # its database, then the migrations, then this Worker. Its deploy reads the
  # Hyperdrive id (WIRING_CLOUDFLARE_HYPERDRIVE_<ENV>, rendered into the
  # HYPERDRIVE binding) and its pages query the migrated, seeded `products`
  # table and the session key the migrations generated, and
  # a job resolves its secrets when it STARTS — so it waits on both,
  # `mode: enforced`, and the ids the applies lease-published are there. A pull
  # request deploys nothing, so nothing on one waits: every edge is advisory
  # there.
  dependsOn:
    - component: cloudflare-hyperdrive
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: db-migrate
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  # The wiring documents the cloudflare-hyperdrive root lease-publishes, one
  # per deployed environment; tooling/wire/live.mjs picks this job's.
  secretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://admin-dashboard/admin-dashboard/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://admin-dashboard/admin-dashboard/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
  # GitHub sign-in's OAuth App (lib/github.ts): values `next build` inlines
  # into the server bundle (next.config.mjs `env`), stored per environment as
  # the product's secrets AUTH_GITHUB_ID and AUTH_GITHUB_SECRET (README →
  # Connecting GitHub sign-in). BEST-EFFORT references, wire-now-seed-later: a
  # key nobody has stored yet is skipped when the job resolves its secrets (no
  # env var, no failure), and a build without them is the dashboard without
  # sign-in, its login page saying how to connect GitHub — so a fresh product
  # deploys and serves before its owner has created an OAuth App at all.
  optionalSecretEnv:
    AUTH_GITHUB_ID: "secret://admin-dashboard/admin-dashboard/{{ .environment }}/AUTH_GITHUB_ID"
    AUTH_GITHUB_SECRET: "secret://admin-dashboard/admin-dashboard/{{ .environment }}/AUTH_GITHUB_SECRET"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: admin-dashboard-web-{dev,stage,prod}.
    workerName: admin-dashboard-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # wrangler.jsonc is COMMITTED — the fixture render, so the composition's
    # structure check (`test -f wrangler.jsonc`, before the build, in a fresh
    # checkout) passes. Stage and prod re-render it here, in their own job
    # tree, from this environment's wiring document, so the Worker binds the
    # real Hyperdrive config; dev verifies with the fixture and has no wiring.
    # The build takes no origin: nothing the dashboard renders is an absolute
    # link, and Auth.js reads the origin from each request (lib/auth.ts).
    buildCommand: if [ "${ORUN_ENVIRONMENT}" != dev ]; then node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-hyperdrive --env "${ORUN_ENVIRONMENT}"; fi && pnpm exec turbo run build --filter=@app/web

    # Smoke: the dashboard renders the products card — "Manage your products"
    # is its description, rendered only once the page's query through the
    # HYPERDRIVE binding returned (not the site's name, which is the owner's
    # to change and HTML-escaped when it carries an `&` or `'`; the proxy has
    # read the session key from the database by then too) — and /api/health
    # answers ok: the database reachable and migrated. Each response is
    # buffered before grep so an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Manage your products' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
